site_name: M3Undle
site_description: Turn oversized IPTV provider lists into lineups your apps can actually use.
site_url: https://sydney-elvis.github.io/M3Undle/
repo_url: https://github.com/Sydney-Elvis/M3Undle
repo_name: Sydney-Elvis/M3Undle
edit_uri: edit/main/docs/user/

docs_dir: docs/user
site_dir: build/docs/site

# Pages that exist but aren't ready for navigation yet (tracked in issue #114).
# Listed here so `mkdocs build --strict` doesn't fail on the "not in nav" warning.
not_in_nav: |
  /guides/use-a-reverse-proxy.md
  /clients/nextpvr.md
  /clients/plex.md
  /clients/tivimate-android-tv.md
  /clients/roku-notes.md
  /troubleshooting/authentication-errors.md
  /troubleshooting/407-errors.md
  /troubleshooting/429-and-rate-limits.md
  /troubleshooting/buffering-and-stream-recovery.md
  /troubleshooting/lan-and-reverse-proxy-problems.md

theme:
  name: material
  # Adds the cookie-settings link and the analytics notice to the footer.
  custom_dir: docs/overrides
  # No web fonts: the theme would otherwise ask Google's font servers for the
  # typeface on every visit, before and regardless of the cookie banner.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  analytics:
    provider: google
    property: G-2GH3CEEX92
  # Google Analytics runs only after the reader accepts this banner: until
  # then the script is not loaded and no request goes to Google. The repository
  # widget, which asks api.github.com for stars and releases, waits for the
  # same choice (the theme lists it as the GitHub cookie).
  consent:
    title: Cookie consent
    description: >-
      This site would like to use Google Analytics to count which help pages
      are read, so that pages nobody uses can be trimmed or rewritten, and to
      show the repository's stars and latest release from GitHub. Nothing is
      sent to Google or GitHub and no cookie is set unless you accept. See the
      Privacy page for details.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics: Google Analytics
      github: GitHub

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search

extra_javascript:
  - javascripts/consent.js

nav:
