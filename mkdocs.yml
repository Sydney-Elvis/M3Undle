      - Channels and Groups: concepts/channels-and-groups.md
      - Profiles and Users: concepts/profiles-and-users.md
      - EPG: concepts/epg.md
      - Stream Proxying: concepts/stream-proxying.md
      - HDHomeRun Compatibility: concepts/hdhomerun-compatibility.md
      - Security: concepts/security.md
      - Retry, Failover, and Cooldowns: concepts/retry-failover-cooldowns.md
