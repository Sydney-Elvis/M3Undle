name: Publish Docker image to GHCR

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-alpha.*"
      - "v*.*.*-beta.*"
      - "v*.*.*-rc.*"
      - "v*.*.*-alpha-test.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags from git ref
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/sydney-elvis/m3undle:${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-alpha."* || "$TAG" == *"-alpha-test."* ]]; then
            echo "ghcr.io/sydney-elvis/m3undle:alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-beta."* ]]; then
            echo "ghcr.io/sydney-elvis/m3undle:beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *"-rc."* ]]; then
            echo "ghcr.io/sydney-elvis/m3undle:rc" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr.io/sydney-elvis/m3undle:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE_UTC=${{ github.event.head_commit.timestamp }}
            SOURCE_REVISION=${{ github.sha }}