name: Publish Core NuGet

on:
  push:
    tags:
      - "core-v*.*.*"
      - "core-v*.*.*-*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the package to GitHub Packages. Leave false to build/test/pack only."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  CONFIGURATION: Release
  CORE_PROJECT: src/M3Undle.Core/M3Undle.Core.csproj
  CORE_TEST_PROJECT: tests/M3Undle.Core.Tests/M3Undle.Core.Tests.csproj
  PACKAGE_OUTPUT: artifacts/packages
  GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/Sydney-Elvis/index.json

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore

      - name: Build Core
        run: dotnet build "$CORE_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Test Core
        run: dotnet test "$CORE_TEST_PROJECT" --configuration "$CONFIGURATION" --no-restore

      - name: Extract Core package version
        run: |
          PACKAGE_VERSION="$(dotnet msbuild "$CORE_PROJECT" -getProperty:PackageVersion)"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Validate tag matches Core package version
        if: startsWith(github.ref, 'refs/tags/core-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#core-v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Core package version '$PACKAGE_VERSION' does not match tag '$GITHUB_REF_NAME'."
            exit 1
          fi

      - name: Pack Core
        run: dotnet pack "$CORE_PROJECT" --configuration "$CONFIGURATION" --no-build --output "$PACKAGE_OUTPUT"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m3undle-core-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error

      - name: Add GitHub Packages source
        if: startsWith(github.ref, 'refs/tags/core-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: >
          dotnet nuget add source "$GITHUB_PACKAGES_SOURCE"
          --name github
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text

      - name: Push Core package
        if: startsWith(github.ref, 'refs/tags/core-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg" --source github --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

      - name: Trigger CLI compatibility check
        if: startsWith(github.ref, 'refs/tags/core-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.CLI_DISPATCH_TOKEN }}
        run: |
          gh workflow run compatibility.yml \
            --repo Sydney-Elvis/m3undle-cli \
            --field core_version="$PACKAGE_VERSION"
